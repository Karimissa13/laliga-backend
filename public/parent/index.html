<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLiga Academy — Parent account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/parent/parent.css">
</head>
<body>
<div class="pact" id="p-act" hidden></div>
<header class="pbar">
  <img class="plogo" src="/brand/logo-on-light.png" alt="LaLiga Academy Abu Dhabi">
  <div class="ptools"><button class="plink" id="p-lang">العربية</button><button class="btn sm ghost" id="p-out" hidden>Sign out</button></div>
</header>
<nav class="ptabs" id="p-tabs" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="children"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.3A4.8 4.8 0 0 1 21 19"/></svg><span>Children</span></button>
  <button data-tab="payments"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Payments</span></button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.6 3.9-6 7.5-6s6.7 2.4 7.5 6"/></svg><span>Profile</span></button>
</nav>
<main class="pwrap" id="p-view"><div class="loading">Loading…</div></main>
<div class="toast" id="toast"></div>
<script src="/parent/parent.js"></script>
</body>
</html>
