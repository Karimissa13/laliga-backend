<!DOCTYPE html>
<html lang="en" data-theme="light"><!-- white background always (Karim, 13 Oct 2026), whatever the computer's dark mode -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaLiga Academy — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <div class="lbrand">
      <img src="/brand/logo-on-light.png" width="200" height="55" alt="LaLiga Academy Abu Dhabi">
      <p>Operations backend</p>
    </div>
    <p>Sign in to the administration system.</p>
    <div class="fld"><label>Email</label><input id="li-email" type="email" placeholder="you@example.com" autocomplete="username"></div>
    <div class="fld"><label>Password</label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="li-go" style="width:100%;margin-top:6px">Sign in</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="brand"><img src="/brand/logo-on-dark.png" width="176" height="49" alt="LaLiga Academy Abu Dhabi"></div>
    <div class="me" title="Signed in"><span class="av" id="me-av" aria-hidden="true"></span><div><b id="who-name">—</b><small id="who-role">—</small></div></div>
    <nav id="nav"></nav>
    <div class="who"><a data-act="myPassword" style="cursor:pointer">Password</a> · <a id="logout" style="cursor:pointer">Sign out</a></div>
  </aside>
  <main>
    <div class="top"><div class="tl"><span id="page-back"></span><h2 id="page-title">Dashboard</h2></div><div class="acts" id="page-acts"></div></div>
    <div class="content" id="view"><div class="loading">Loading…</div></div>
  </main>
</div>

<div id="drawer"><div class="panel"><div class="dh"><h3 id="dw-title">Detail</h3><button class="close" data-act="closeDrawer">×</button></div><div class="db" id="dw-body"></div></div></div>
<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
